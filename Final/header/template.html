<section class="main-hero">
    <div class="main-hero__text">
        <h1 class="main-hero__title">{{mainHeroTitle}}</h1>
        <h2 class="main-hero__subtitle">{{mainHeroSubtitle}}</h2>
        <p class="main-hero__description">{{mainHeroDescription}}</p>
        <a href="#" class="main-hero__button">{{mainHeroButton}}</a>
    </div>
    <div class="main-hero__image">
        <img src="{{mainHeroImageSrc}}" alt="{{mainHeroImageAlt}}" width="507" height="492">
    </div>
</section>
