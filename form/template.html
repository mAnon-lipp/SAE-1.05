<section id ="démo" class="demo-section">
    <div class="demo-section__content">
        <div class="demo-form">
            <h1 class="demo-form__title">{{demoTitle}}</h1>
            <p class="demo-form__description">{{demoDescription}}</p>
            <form class="demo-form__form">
                <input type="email" class="demo-form__input" placeholder="{{emailPlaceholder}}" required>
                <button type="submit" class="demo-form__button">{{buttonText}}</button>
            </form>
        </div>
        <div class="demo-image">
            <img src="{{imageSrc}}" alt="{{imageAlt}}" class="demo-image__img">
        </div>
    </div>
</section>
