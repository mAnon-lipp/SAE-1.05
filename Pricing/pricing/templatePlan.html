<div class="pricing__plan {{planClass}}">
    <h2 class="pricing__plan-title">{{planTitle}}</h2>
    <p class="pricing__plan-subtitle">{{planSubtitle}}</p>
    <div class="pricing__plan-price">{{planPrice}}</div>
    <button class="pricing__plan-button">{{buttonText}}</button>
    <ul class="pricing__plan-features">
        {{planFeatures}}
    </ul>
</div>
