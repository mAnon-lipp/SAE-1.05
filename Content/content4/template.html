<div class="comparison-container">
    <div class="comparison">
        <h1 class="comparison__title">{{comparisonTitle}}</h1>
        <table class="comparison__table">
            <thead>
                <tr>
                    <th class="comparison__header--feature">Features</th>
                    <th class="comparison__header--empty"></th>
                    <th class="comparison__header--free">Free</th>
                    <th class="comparison__header--pro">Pro</th>
                </tr>
            </thead>
            <tbody>
                {{comparisonRows}}
            </tbody>
        </table>
    </div>
</div>
