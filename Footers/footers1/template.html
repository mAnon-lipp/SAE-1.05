<footer class="footer1">
    <div class="footer1__container">
        <div class="footer1__left">
            <h2 class="footer1__title">{{footerTitle}}</h2>
        </div>
        <div class="footer1__right">
            <ul class="footer1__links">
                {{footerLinks}}
            </ul>
        </div>
    </div>
    <div class="footer1__line"></div>
    <div class="footer1__bottom">
        <ul class="footer1__nav">
            {{footerNav}}
        </ul>
        <p class="footer1__text">{{footerText}}</p>
    </div>
</footer>
