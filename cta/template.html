<section class="call-to-action">
    <img src="{{ctaImageSrc}}" alt="{{ctaImageAlt}}" class="call-to-action__logo">
    <div class="call-to-action__text">
        <h1 class="call-to-action__title">{{ctaTitle}}</h1>
        <p class="call-to-action__subtitle">{{ctaSubtitle}}</p>
    </div>
    <button class="call-to-action__button">{{ctaButtonText}}</button>
</section>
