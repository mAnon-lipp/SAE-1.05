<div class="signup">
    <h1 class="signup__title">{{signupTitle}}</h1>
    <form class="signup__form">
        <input type="email" placeholder="{{emailPlaceholder}}" required class="signup__input" />
        <input type="password" placeholder="{{passwordPlaceholder}}" required class="signup__input" />
        <button type="submit" class="signup__button">{{buttonText}}</button>
    </form>
    <p class="signup__terms">{{signupTerms}}</p>
</div>
