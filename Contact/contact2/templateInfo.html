<div class="get-in-touch__info">
    <h2 class="get-in-touch__info-title">{{infoTitle}}</h2>
    <p class="get-in-touch__info-description">{{infoDescription}}</p>
    <p class="get-in-touch__info-item"><i class="phone-icon"></i> {{phone}}</p>
    <p class="get-in-touch__info-item"><i class="email-icon"></i> {{email}}</p>
    <div class="get-in-touch__socials-bar"></div>
    <div class="get-in-touch__socials">
        <h3 class="get-in-touch__socials-title">{{socialsTitle}}</h3>
        <ul class="get-in-touch__socials-list">
            {{socialsItems}}
        </ul>
    </div>
</div>
