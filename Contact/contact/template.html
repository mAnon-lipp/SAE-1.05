<section class="contact">
    <div class="contact__header">
        <h1 class="contact__title">{{contactTitle}}</h1>
        <p class="contact__subtitle">{{contactSubtitle}}</p>
        <p class="contact__phone">📞 {{contactPhone}}</p>
    </div>
    <div class="contact__content">
        <form class="contact__form">
            <div class="contact__form-group">
                <input type="text" class="contact__input contact__input--name" placeholder="{{contactNamePlaceholder}}">
                <input type="email" class="contact__input contact__input--email" placeholder="{{contactEmailPlaceholder}}">
            </div>
            <div class="contact__form-group">
                <input type="tel" class="contact__input contact__input--phone" placeholder="{{contactPhonePlaceholder}}">
                <select class="contact__select contact__select--budget">
                    <option>{{contactBudgetPlaceholder}}</option>
                </select>
                <select class="contact__select contact__select--company-size">
                    <option>{{contactCompanySizePlaceholder}}</option>
                </select>
            </div>
            <textarea class="contact__textarea" placeholder="{{contactMessagePlaceholder}}"></textarea>
            <button type="submit" class="contact__button">{{contactButtonText}}</button>
        </form>
        <aside class="contact__help">
            <h2 class="contact__help-title">{{helpTitle}}</h2>
            <p class="contact__help-text">{{helpText}}</p>
        </aside>
    </div>
</section>
