<div class="ecommerce">
    <div class="ecommerce__image">
        <img src="{{ecommerceImageSrc}}" alt="{{ecommerceImageAlt}}" class="ecommerce__image-item" />
    </div>
    <div class="ecommerce__text">
        <h2 class="ecommerce__brand">{{ecommerceBrand}}</h2>
        <h3 class="ecommerce__promo">{{ecommercePromo}}</h3>
        <p class="ecommerce__description">{{ecommerceDescription}}</p>
        <p class="ecommerce__price">
            {{ecommercePrice}} <span class="ecommerce__original-price">{{ecommerceOriginalPrice}}</span>
        </p>
        <div class="ecommerce__buttons">
            <button class="ecommerce__button ecommerce__button--buy-now">{{buyNowText}}</button>
            <button class="ecommerce__button ecommerce__button--view-more">{{viewMoreText}}</button>
        </div>
    </div>
</div>
