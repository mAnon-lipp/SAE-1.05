<div class="flights__option">
    <img src="{{optionImageSrc}}" alt="{{optionImageAlt}}" class="flights__image-item" />
    <div class="flights__details">
        <h2 class="flights__option-title">{{optionTitle}}</h2>
        <p class="flights__price">{{optionPrice}}</p>
        <p class="flights__text">{{optionText}}</p>
        <button class="flights__button flights__button--primary">{{primaryButtonText}}</button>
        <button class="flights__button flights__button--secondary">{{secondaryButtonText}}</button>
    </div>
</div>
