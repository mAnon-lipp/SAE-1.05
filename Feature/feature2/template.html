<section class="page">
    <h1 class="page__title">{{pageTitle}}</h1>
    <section class="page__content">
        <section class="page__left">
            <p class="page__text">{{pageText}}</p>
        </section>
        <section class="page__image">
            <img src="{{pageImageSrc}}" alt="{{pageImageAlt}}" class="page__image-content">
        </section>
        <section class="page__info">
            {{pageInfo}}
        </section>
    </section>
</section>
